<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bayar dengan QRIS</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#15222B;--muted:#5E6C77;--line:#D5DDE2;--bg:#E8EDF0;--paper:#fff;--qris:#D9261C;--ok:#0F8F5F;--warn:#9A5B00;
--sans:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
@media(prefers-color-scheme:dark){:root{--ink:#E8EEF2;--muted:#9AA9B4;--line:#33424D;--bg:#10181E;--paper:#1A252D;--qris:#FF6A5F;--ok:#3DD598;--warn:#F0B35A}}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:20px}
.receipt{background:var(--paper);width:100%;max-width:360px;border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 12px 32px -12px rgba(0,0,0,.25);overflow:hidden}
.top{padding:22px 24px 18px}
.top small{color:var(--muted);font-size:13px}
.amount{font:600 34px/1.15 var(--mono);letter-spacing:-.5px;margin:4px 0 6px}
.break{font:500 12.5px var(--mono);color:var(--muted)}
.tear{position:relative;border-top:2px dashed var(--line);margin:0}
.tear::before,.tear::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg)}
.tear::before{left:-10px}.tear::after{right:-10px}
.mid{padding:22px 24px;display:grid;justify-items:center;gap:14px}
.qrbox{position:relative;width:236px;height:236px;background:#fff;border-radius:8px;border:1px solid var(--line);padding:8px}
.qrbox img{width:100%;height:100%;display:block;transition:opacity .4s}
.paid .qrbox img,.expired .qrbox img{opacity:.08}
.stamp{position:absolute;inset:0;display:none;place-items:center;pointer-events:none}
.stamp span{font:600 38px var(--mono);letter-spacing:3px;padding:6px 18px;border:4px solid;border-radius:8px;transform:rotate(-9deg)}
.paid .stamp,.expired .stamp{display:grid}
.paid .stamp span{color:var(--ok);animation:stamp .45s cubic-bezier(.2,1.4,.4,1)}
.expired .stamp span{color:var(--qris);font-size:28px}
@keyframes stamp{from{transform:rotate(-9deg) scale(2.2);opacity:0}to{transform:rotate(-9deg) scale(1);opacity:1}}
.bar{width:100%;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--qris);transition:width 1s linear}
.row{display:flex;justify-content:space-between;width:100%;font-size:14px;color:var(--muted)}
.row b{color:var(--ink);font:600 15px var(--mono)}
.state{width:100%;text-align:center;font-weight:600;font-size:15px;padding:11px;border-radius:8px;background:rgba(154,91,0,.1);color:var(--warn)}
.paid .state{background:rgba(15,143,95,.12);color:var(--ok)}
.expired .state{background:rgba(217,38,28,.1);color:var(--qris)}
.btns{display:flex;gap:8px;width:100%}
button{font:500 14px var(--sans);color:var(--ink);background:none;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;flex:1}
button:hover{border-color:var(--ink)}button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--qris);outline-offset:2px}
label{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.detail{display:none;padding:16px 24px 22px;font-size:13.5px;color:var(--muted);gap:6px}
.paid .detail{display:grid}
.detail div{display:flex;justify-content:space-between;gap:12px}.detail b{color:var(--ink);font-weight:500;text-align:right;word-break:break-all}
.msg{padding:40px 24px;text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="receipt" id="app">
  <div class="msg" id="loading">Memuat pembayaran…</div>
</main>
<template id="tpl">
  <section class="top">
    <small id="ref">Total bayar</small>
    <div class="amount" id="amount"></div>
    <div class="break" id="break"></div>
  </section>
  <div class="tear"></div>
  <section class="mid">
    <div class="qrbox"><img id="qr" alt="Kode QRIS"><div class="stamp"><span id="stamp"></span></div></div>
    <div class="bar" id="barwrap"><i id="bar"></i></div>
    <div class="row"><span>Sisa waktu</span><b id="timer">--:--</b></div>
    <div class="state" id="state" role="status" aria-live="polite">Menunggu pembayaran</div>
    <div class="btns"><button id="check">Cek pembayaran</button></div>
    <label><input type="checkbox" id="auto" checked> Cek otomatis tiap 10 detik</label>
  </section>
  <section class="detail" id="detail">
    <div><span>Kode transaksi</span><b id="d-trx"></b></div>
    <div><span>Order ID</span><b id="d-order"></b></div>
    <div><span>Sumber</span><b id="d-issuer"></b></div>
    <div><span>Waktu</span><b id="d-time"></b></div>
  </section>
</template>
<script>
const id = location.pathname.split('/').filter(Boolean).pop();
const $ = s => document.getElementById(s);
const rp = n => 'Rp ' + Number(n).toLocaleString('id-ID');
let info, offset = 0, done = false, busy = false, timer, poll;

(async function init() {
  const r = await fetch('/api/qr-info/' + id).catch(() => null);
  if (!r || !r.ok) { $('loading').textContent = 'Pembayaran tidak ditemukan atau sudah dihapus.'; return; }
  info = await r.json();
  offset = info.server_now - Date.now();
  $('app').replaceChildren($('tpl').content.cloneNode(true));
  $('amount').textContent = rp(info.amount);
  if (info.ref) $('ref').textContent = info.ref;
  if (info.unique_code) $('break').textContent = rp(info.base_amount) + ' + kode unik ' + info.unique_code;
  $('qr').src = '/qr/' + id + '?format=raw';
  $('check').onclick = check;
  $('auto').onchange = e => e.target.checked ? startPoll() : clearInterval(poll);
  if (info.status === 'PAID') return paid(info.transaction);
  if (info.status === 'EXPIRED') return expired();
  tick(); timer = setInterval(tick, 1000);
  startPoll(); check();
})();

function tick() {
  const left = info.expires_at - (Date.now() + offset);
  if (left <= 0) return expired();
  $('timer').textContent = String(Math.floor(left / 60000)).padStart(2, '0') + ':' + String(Math.floor(left % 60000 / 1000)).padStart(2, '0');
  $('bar').style.width = Math.max(0, left / 300000 * 100) + '%';
}
function startPoll() { clearInterval(poll); poll = setInterval(check, 10000); }
function stopAll() { done = true; clearInterval(timer); clearInterval(poll); $('check').disabled = true; $('auto').disabled = true; }

async function check() {
  if (busy || done) return;
  busy = true; $('check').textContent = 'Memeriksa…';
  try {
    const d = await (await fetch('/api/qr-status/' + id)).json();
    if (d.paid) paid(d.transaction);
    else if (d.status === 'EXPIRED') expired();
  } catch (e) { /* jaringan putus: coba lagi di putaran berikutnya */ }
  busy = false; if (!done) $('check').textContent = 'Cek pembayaran';
}
function paid(tx) {
  stopAll();
  document.body.className = 'paid';
  $('timer').textContent = '--:--'; $('bar').style.width = '0%';
  $('stamp').textContent = 'LUNAS';
  $('state').textContent = 'Pembayaran berhasil diterima';
  $('check').textContent = 'Selesai';
  if (tx) {
    $('d-trx').textContent = info.trx_id;
    $('d-order').textContent = tx.order_id || tx.transaction_id || '-';
    $('d-issuer').textContent = tx.payer_issuer || 'GoPay / Bank';
    $('d-time').textContent = tx.transaction_time ? new Date(tx.transaction_time).toLocaleString('id-ID') : '-';
  }
  document.title = 'Lunas · ' + rp(info.amount);
}
function expired() {
  stopAll();
  document.body.className = 'expired';
  $('timer').textContent = '00:00'; $('bar').style.width = '0%';
  $('stamp').textContent = 'KEDALUWARSA';
  $('state').textContent = 'Waktu habis. Minta QRIS baru ke penjual.';
  $('check').textContent = 'Kedaluwarsa';
}
</script>
</body>
</html>
